name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Rust 1.89.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify pinned toolchain
        run: rustc --version | grep '^rustc 1\.89\.0 '
      - name: Verify lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test all targets
        run: cargo test --all-targets --all-features --locked
      - name: Test documentation
        run: cargo test --doc --all-features --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --all-features --locked
