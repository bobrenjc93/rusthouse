name: Rust quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show pinned toolchain
        run: rustc --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run all-target tests
        run: cargo test --locked --all-targets --all-features

      - name: Build rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features

      - name: Run doctests
        run: RUSTDOCFLAGS="-D warnings" cargo test --locked --doc --all-features
