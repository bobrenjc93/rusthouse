[package]
name = "rusthouse"
version = "0.1.0"
edition = "2024"
description = "A small, understandable analytical database written in Rust"
license = "MIT"
repository = "https://github.com/bobrenjc93/rusthouse"

[dependencies]
fs4 = "1.1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
