[package]
name = "rusthouse"
default-run = "rusthouse"
version = "0.2.0"
edition = "2024"
description = "A small, understandable analytical database written in Rust"
license = "MIT"
repository = "https://github.com/bobrenjc93/rusthouse"

[dependencies]

[[bin]]
name = "clickhouse-parity-bench"
path = "benchmark/main.rs"

[[bench]]
name = "int64_scan"
path = "benchmark/int64_scan.rs"
harness = false

[[bench]]
name = "engine_int64_scan"
path = "benchmark/engine_int64_scan.rs"
harness = false
