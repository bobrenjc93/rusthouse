[package]
name = "rusthouse"
default-run = "rusthouse"
version = "0.1.0"
edition = "2024"
description = "A small, understandable analytical database written in Rust"
license = "MIT"
repository = "https://github.com/bobrenjc93/rusthouse"

[features]
default = []
benchmark-verifier = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }

[[bin]]
name = "clickhouse-parity-bench"
path = "benchmark/main.rs"
