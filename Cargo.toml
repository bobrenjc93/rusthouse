[package]
name = "rusthouse"
version = "0.1.0"
edition = "2024"
description = "A small, understandable analytical database written in Rust"
license = "MIT"
repository = "https://github.com/bobrenjc93/rusthouse"

[dependencies]
sqlparser = "0.46"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1.5"

[[bench]]
name = "analytical"
harness = false
